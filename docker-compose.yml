version: "3.8"

services:
  fixitfixa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixitfixa-manager
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./state.json:/app/state.json
      - ./manager.log:/app/manager.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
